name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          name: StreamGuard ${{ github.ref_name }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.zip
            release/*.xpi
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
